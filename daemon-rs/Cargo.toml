[package]
name = "e404-daemon"
version = "1.2.0"
edition = "2021"
authors = ["E404 x Antigravity"]
description = "Ultra-low CPU event-driven game & battery saver detection daemon for Poco X3 Pro (SM8150)"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
